[package]
name = "arb_native"
version = "0.1.0"
authors = ["Adrian Kumpf"]
edition = '2024'

[lib]
name = "arb_native"
path = "src/lib.rs"
crate-type = ["dylib"]

[dependencies]
rustler = { version = "0.38.0", features = ["nif_version_2_16"] }
# Pinned to a revision, not a tag: 0.8.0 is deliberately untagged until this
# branch and a downstream deployment have validated it. Swap for `tag = "v0.8.0"`
# once it is cut.
arb = { git = "https://github.com/adriankumpf/abacom-relay-board", rev = "0387c267605fbbf64b24fcd28d31a265179ecc33" }
