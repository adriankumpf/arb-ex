[package]
name = "arb_native"
version = "0.1.0"
authors = ["Adrian Kumpf"]
edition = '2024'

[lib]
name = "arb_native"
path = "src/lib.rs"
# The BEAM loads a NIF through the C ABI, so this exports `nif_init` and nothing
# else; `dylib` is the Rust-to-Rust format and exports the whole mangled surface.
crate-type = ["cdylib"]

[dependencies]
rustler = { version = "0.38.0", features = ["nif_version_2_16"] }
# TODO: swap for `tag = "v0.8.0"` once it is cut. Untagged until this branch and a
# downstream deployment have validated it.
arb = { git = "https://github.com/adriankumpf/abacom-relay-board", rev = "7b990e87b5195e7076da7974b8be8041c1e857af" }
# Not called directly — `arb` owns every rusb call. Named here only so `vendored`
# below has a dependency to forward to; cargo unifies the feature onto the copy
# `arb` already resolves.
rusb = "0.9.4"

[features]
default = ["vendored"]
# Compile libusb from the copy `libusb1-sys` vendors instead of linking whatever
# `pkg-config` finds. A precompiled NIF has to carry libusb with it: the machine
# that downloads the artifact never ran the build and cannot be assumed to have
# `libusb-1.0.so.0`.
vendored = ["rusb/vendored"]
