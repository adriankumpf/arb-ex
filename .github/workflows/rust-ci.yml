name: Rust CI
on:
  push:
    branches:
      - master
    paths:
      - "native/**"
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/rust-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-rust:
    name: Lint Rust
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - native/arb_native/Cargo.toml

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      # `cargo test` links a real binary, unlike `clippy`. Without the system
      # library `libusb1-sys` falls back to compiling its vendored copy, so this
      # is for build time rather than to make the link work at all.
      - name: Install libusb
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            native/arb_native/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.job.target }}
          components: rustfmt, clippy

      - name: Run rustfmt in check mode
        run: cargo fmt --manifest-path=${{ matrix.manifest }} --all -- --check

      - name: Run clippy
        run: cargo clippy --manifest-path=${{ matrix.manifest }} --all-targets -- -Dwarnings

      - name: Run tests
        run: cargo test --manifest-path=${{ matrix.manifest }}
