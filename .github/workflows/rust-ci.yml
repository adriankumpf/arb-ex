name: Rust CI
on:
  push:
    branches:
      - master
    paths:
      - "native/**"
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/rust-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-rust:
    name: Lint Rust
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - native/arb_native/Cargo.toml

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            native/arb_native/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Run rustfmt in check mode
        run: cargo fmt --manifest-path=${{ matrix.manifest }} --all -- --check

      - name: Run clippy
        run: cargo clippy --manifest-path=${{ matrix.manifest }} --all-targets -- -Dwarnings

      - name: Run tests
        # Since rustler 0.39 the enif_* functions are plain extern symbols. The
        # BEAM provides them when it loads the NIF, but the test executable has
        # nothing to resolve them against. The unit tests never call into the
        # VM, so leave those symbols unresolved instead of failing the link.
        # rust-lld (the x86_64 default) keeps them as dynamic imports, and
        # rustc's `-z now` would make the loader reject the binary at startup;
        # `-z lazy` defers that to a first call, which never happens.
        env:
          RUSTFLAGS: -C link-arg=-Wl,--unresolved-symbols=ignore-in-object-files -C link-arg=-Wl,-z,lazy
        run: cargo test --manifest-path=${{ matrix.manifest }}
