name: Rust CI
on:
  push:
    # The default branch is `master`; this said `main`, so pushes never ran it.
    branches:
      - master
    paths:
      - "native/**"
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/rust-ci.yml"
  workflow_dispatch:

jobs:
  lint-rust:
    name: Lint Rust
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - native/arb_native/Cargo.toml

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      # `cargo test` links a real binary, unlike `clippy`, so libusb has to be
      # there rather than merely declared.
      - name: Install libusb
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            native/arb_native/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.job.target }}
          components: rustfmt, clippy

      - name: Run rustfmt in check mode
        run: cargo fmt --manifest-path=${{ matrix.manifest }} --all -- --check

      - name: Run clippy
        run: cargo clippy --manifest-path=${{ matrix.manifest }} --all-targets -- -Dwarnings

      # The relay-number-to-bit mapping lives here, and the Elixir suite has no
      # board to catch an off-by-one in it.
      - name: Run tests
        run: cargo test --manifest-path=${{ matrix.manifest }}
